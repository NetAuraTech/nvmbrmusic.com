name: Docker image

# Builds the production image (the multi-stage Dockerfile at the repo root) and
# pushes it to the GitHub Container Registry.
#
# Triggered manually from the Actions tab (workflow_dispatch); the optional
# `ref` input selects the branch or tag to build (defaults to main).
#
# Tags pushed per build:
#   - the short git sha (always)
#   - `latest` (only when building the default branch)
#
# The image is public, like the repository. No extra secret is needed: the
# default GITHUB_TOKEN carries the packages:write permission declared below.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

# A second manual trigger while one is running is a mistake — cancel the
# in-progress run rather than queueing it.
concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
