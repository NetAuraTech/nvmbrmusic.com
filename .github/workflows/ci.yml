name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint:ci

      - name: Run oxfmt check
        run: npm run format:ci

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:front

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_ENABLED: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests (unit + functional)
        run: npm run test --workspace @foundry/web -- unit functional

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  codegen-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs "node ace codegen" in the app workspace and waits for its
      # completion marker (see the action's description for why the warmup
      # entry point is the only one that regenerates every committed codegen file).
      - name: Regenerate codegen output
        uses: ./.github/actions/regenerate-codegen
        with:
          working-directory: apps/web

      - name: Fail when the committed codegen output has drifted
        run: |
          if ! git diff --exit-code -- apps/web/.adonisjs/; then
            echo ''
            echo '::error::The committed apps/web/.adonisjs/ files are out of sync with the codegen output.'
            echo '::error::Run the codegen locally ("node ace codegen" from apps/web), then commit the updated apps/web/.adonisjs/ directory.'
            exit 1
          fi
